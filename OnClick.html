<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OnClick Events </title>
    <link rel="stylesheet" href="OnClickCSS.css">
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">

</head>

<body>

<!-- Rotating box -->
<div class="rotating-box"></div>

<div class="container">
  <h5>Interactive Buttons Demo</h5>
  <button class="btn-dark" onclick="toggleDarkMode()">Dark / Light Mode</button>
  <button class="btn-rgb" onclick="toggleRGB()" id="rgbBtn">Start RGB</button>
  <button class="btn-hide" onclick="hideButton(this)">Hide Me</button>
</div>


</body>

    <script src="OnClickJS.js"></script>
</html>
